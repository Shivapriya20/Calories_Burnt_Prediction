<body data-new-gr-c-s-check-loaded="14.1106.0" data-gr-ext-installed="">
	<h1>Calorie Prediction App</h1>

	<form id="calorie-form">
		<label for="age">Age (in years): </label>
		<input type="number" id="age" name="age" required="">

		<br>

		<label for="height">Height (in cm): </label>
		<input type="number" id="height" name="height" required="">

		<br>

		<label for="weight">Weight (in kg): </label>
		<input type="number" id="weight" name="weight" required="">

		<br>

		<label for="duration">Duration (in minutes): </label>
		<input type="number" id="duration" name="duration" required="">

		<br>

		<label for="heart_rate">Heart Rate (in bpm): </label>
		<input type="number" id="heart_rate" name="heart_rate" required="">

		<br>

		<label for="body_temp">Body Temperature (in Celsius): </label>
		<input type="number" id="body_temp" name="body_temp" required="">

		<br>

		<input type="submit" value="Predict Calories">
	</form>

	<div class="result" id="result"></div>

	<script>
		document.getElementById("calorie-form").addEventListener("submit", function(e) {
			e.preventDefault();

			var age = parseInt(document.getElementById("age").value);
			var height = parseInt(document.getElementById("height").value);
			var weight = parseInt(document.getElementById("weight").value);
			var duration = parseInt(document.getElementById("duration").value);
			var heart_rate = parseInt(document.getElementById("heart_rate").value);
			var body_temp = parseInt(document.getElementById("body_temp").value);

			var result = (10 * weight) + (6.25 * height) - (5 * age) + 5;
			result += (heart_rate * 0.5) - (duration * 0.7) + (body_temp * 0.1);

			document.getElementById("result").innerHTML = "Calories burned: " + result.toFixed(2);
		});
	</script>
